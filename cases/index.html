<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейс — Midnight Collective</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 300; src: url('../fonts/inter-300.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 400; src: url('../fonts/inter-400.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; src: url('../fonts/inter-500.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('../fonts/inter-600.woff2') format('woff2'); }
@font-face { font-family: 'Roboto Mono'; font-weight: 400; src: url('../fonts/roboto-mono-400.woff2') format('woff2'); }

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #fff; color: #000; }

nav { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; }
.logo { font-size: 24px; font-weight: 500; letter-spacing: -0.06em; text-decoration: none; color: #000; }
.nav-links { display: flex; gap: 56px; }
.nav-links a { font-size: 32px; font-weight: 500; letter-spacing: -0.06em; color: #000; text-decoration: none; }
.nav-links a:hover { text-decoration: underline; }

.case-top { display: grid; grid-template-columns: 1fr 2fr; gap: 48px; padding: 78px 48px 62px; }
.case-desc { font-size: 12px; line-height: 1.4; color: #333; max-width: 280px; }
.case-desc p + p { margin-top: 16px; }

.case-meta-bar { display: flex; align-items: center; gap: 12px; padding: 0 48px 20px; font-size: 12px; font-weight: 500; letter-spacing: -0.03em; }
.case-meta-tags { color: #aaa; }

.case-grid { padding: 0 48px; display: flex; flex-direction: column; gap: 16px; }
.grid-row { display: grid; gap: 16px; width: 100%; align-items: start; }
.grid-row.c3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-row.c2 { grid-template-columns: 1fr 1fr; }
.grid-row.c2-ratio { grid-template-columns: 1.6fr 1fr; }
.grid-row.c1 { grid-template-columns: 1fr; }
.ci { overflow: hidden; width: 100%; background: #fff; display: flex; align-items: flex-start; justify-content: center; }
.ci img, .ci video { width: 100%; height: auto; object-fit: contain; display: block; }

.nav-between { display: flex; justify-content: space-between; align-items: flex-end; padding: 80px 48px; margin-top: 64px; }
.nav-prev, .nav-next { font-size: clamp(36px, 5vw, 72px); font-weight: 700; color: #ebebeb; text-decoration: none; letter-spacing: -0.04em; line-height: 1; }
.nav-prev:hover, .nav-next:hover { color: #bbb; }

footer { padding: 64px 48px 0; margin-top: 120px; background: #fff; }
.footer-phone, .footer-email { font-size: 44px; font-weight: 500; letter-spacing: -0.06em; line-height: 1.1; color: #000; }
.footer-contacts { padding: 0 0 48px; }
.footer-wm { font-weight: 600; letter-spacing: -0.06em; color: #ebebeb; line-height: 1; white-space: nowrap; display: block; font-size: 11.35vw; padding-bottom: 0.1em; }
.footer-wm-logo { display: block; width: 100%; padding: 0.1em 0; }
.footer-btm { display: flex; gap: 32px; padding: 48px 0 32px; }
.footer-btm a { font-size: 12px; font-weight: 500; letter-spacing: -0.06em; color: #000; text-decoration: none; }
.footer-btm a:hover { text-decoration: underline; }

.loading { padding: 200px 48px; font-size: 24px; color: #aaa; }

.burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; z-index: 1001; background: none; border: none; padding: 4px; }
.burger span { display: block; width: 24px; height: 2px; background: #000; }
.burger-menu { display: none; position: fixed; inset: 0; background: #fff; z-index: 1000; flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 180px 20px 40px; }
.burger-menu.open { display: flex; }
.burger-nav-fixed { position: fixed; top: 0; left: 0; right: 0; padding: 20px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1001; background: #fff; }
.burger-nav-fixed .logo { font-size: 18px; }
.burger-menu a { font-size: 36px; font-weight: 500; letter-spacing: -0.06em; color: #000; text-decoration: none; line-height: 1.1; display: block; }
.burger-menu .burger-order { margin-bottom: 40px; }
.burger-menu .burger-links { display: flex; flex-direction: column; gap: 4px; }
.burger-time { font-family: 'Roboto Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; color: #666; margin-top: 40px; }
@media (max-width: 768px) {
  nav { padding: 20px; }
  .logo { font-size: 18px; }
  .nav-links { display: none; }
  .burger { display: flex; }
  .case-top { grid-template-columns: 1fr; gap: 24px; padding: 32px 20px; }
  .case-desc { max-width: 100%; font-size: 13px; }
  .case-meta-bar { padding: 0 20px 16px; flex-wrap: wrap; }
  .case-grid { padding: 0 20px; gap: 10px; }
  .grid-row.c3 { grid-template-columns: 1fr; }
  .grid-row.c2 { grid-template-columns: 1fr 1fr; }
  .grid-row.c2-ratio { grid-template-columns: 1fr 1fr; }
  .ci.fixed-h { height: 240px; }
  .nav-between { padding: 40px 20px; flex-direction: row; align-items: flex-end; gap: 0; }
  .nav-prev, .nav-next { font-size: 24px; }
  footer { padding: 40px 20px 0; margin-top: 60px; }
  .footer-phone, .footer-email { font-size: 28px; }
  .footer-btm { gap: 16px; flex-wrap: wrap; padding: 32px 0 24px; }
  a { color: #000; }
}
</style>
</head>
<body>

<nav>
  <a href="../" class="logo">Midnight Collective</a>
  <div class="nav-links">
    <a href="../#cases">Работы</a>
    <a href="../#form">Заказать проект</a>
  </div>

<button class="burger" onclick="toggleBurger()" id="burger-btn" aria-label="Меню">
    <span></span><span></span>
  </button>
</nav>

<div class="burger-menu" id="burger-menu">
  <div class="burger-nav-fixed">
    <a href="../" class="logo">Midnight Collective</a>
  </div>
  <a href="../#form" class="burger-order" onclick="goTo('../#form')">Заказать проект</a>
  <div class="burger-links">
    <a href="../#cases" onclick="goTo('../#cases')">Кейсы</a>
    <a href="../#cases" onclick="goTo('../#cases')">Услуги</a>
    <a href="../#cases" onclick="goTo('../#cases')">Кто мы?</a>
    <a href="../#form" onclick="goTo('../#form')">Процесс</a>
  </div>
  <div class="burger-time" id="burger-clock"></div>
</div>

<div id="content"><div class="loading">Загрузка...</div></div>

<footer>
  <div class="footer-contacts">
    <div class="footer-phone">+7 (912) 021-43-07</div>
    <div class="footer-email">midnight2collective@gmail.com</div>
  </div>
  <img src="../logo.svg" alt="Midnight Collective" class="footer-wm-logo">
  <div class="footer-btm">
    <a href="../privacy/">Политика конфиденциальности</a>
  </div>
</footer>

<script>
function renderMedia(img) {
  if (!img.url) return '';
  const url = img.url.toLowerCase();
  if (url.includes('.mp4') || url.includes('.webm') || url.includes('video')) {
    return `<video src="${img.url}" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:contain;display:block;"></video>`;
  }
  return `<img src="${img.url}" alt="" loading="lazy">`;
}

function renderRow(row) {
  const items = row.images.map(img => `
    <div class="ci">
      ${renderMedia(img)}
    </div>
  `).join('');
  return `<div class="grid-row ${row.type}">${items}</div>`;
}

async function load() {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) { document.getElementById('content').innerHTML = '<div class="loading">Кейс не найден</div>'; return; }

  try {
    const r = await fetch('https://raw.githubusercontent.com/egorasus/midnight-collective/main/data/projects.json?t=' + Date.now());
    const projects = await r.json();
    const idx = projects.findIndex(p => p.slug === slug);
    if (idx === -1) { document.getElementById('content').innerHTML = '<div class="loading">Кейс не найден</div>'; return; }

    const p = projects[idx];
    document.title = `${p.title} — Midnight Collective`;

    const prev = projects[(idx - 1 + projects.length) % projects.length];
    const next = projects[(idx + 1) % projects.length];

    document.getElementById('content').innerHTML = `
      <div class="case-top">
        <div class="case-desc">
          ${p.desc.map(d => `<p>${d}</p>`).join('')}
        </div>
        <div></div>
      </div>

      <div class="case-meta-bar">
        <span>${p.title}</span>
        <span class="case-meta-tags">${p.tags.join(' &nbsp; ')} &nbsp; ${p.year}</span>
      </div>

      <div class="case-grid">
        ${(p.rows || []).map(renderRow).join('')}
      </div>

      <div class="nav-between">
        <a href="?slug=${prev.slug}" class="nav-prev">Предыдущий</a>
        <a href="?slug=${next.slug}" class="nav-next">Следующий</a>
      </div>
    `;
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading">Ошибка загрузки</div>';
    console.error(e);
  }
}

load();

function goTo(url) {
  const menu = document.getElementById('burger-menu');
  menu.classList.remove('open');
  document.body.style.overflow = '';
  const btn = document.getElementById('burger-btn');
  btn.innerHTML = '<span></span><span></span>';
  setTimeout(() => { window.location.href = url; }, 10);
}
function toggleBurger() {
  const menu = document.getElementById('burger-menu');
  menu.classList.toggle('open');
  const open = menu.classList.contains('open');
  document.body.style.overflow = open ? 'hidden' : '';
  const btn = document.getElementById('burger-btn');
  btn.innerHTML = open ? '<svg width="24" height="24" viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22" stroke="black" stroke-width="2"/><line x1="22" y1="2" x2="2" y2="22" stroke="black" stroke-width="2"/></svg>' : '<span></span><span></span>';
}
function updateClock() {
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  const h = String(msk.getHours()).padStart(2,'0'), m = String(msk.getMinutes()).padStart(2,'0'), s = String(msk.getSeconds()).padStart(2,'0');
  const el = document.getElementById('burger-clock');
  if (el) el.textContent = h+':'+m+':'+s+' МСК';
}
updateClock(); setInterval(updateClock, 1000);
</script>

</body>
</html>
