<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проекты — Midnight Collective</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 300; src: url('../fonts/inter-300.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 400; src: url('../fonts/inter-400.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; src: url('../fonts/inter-500.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('../fonts/inter-600.woff2') format('woff2'); }
@font-face { font-family: 'Roboto Mono'; font-weight: 400; src: url('../fonts/roboto-mono-400.woff2') format('woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #fff; color: #000; }

/* NAV */
nav { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; position: fixed; top: 0; left: 0; right: 0; background: #fff; z-index: 100; }
.logo { font-size: 24px; font-weight: 500; letter-spacing: -0.06em; text-decoration: none; color: #000; }
.nav-links { display: flex; gap: 56px; }
.nav-links a { font-size: 32px; font-weight: 500; letter-spacing: -0.06em; color: #000; text-decoration: none; }
.nav-links a:hover { text-decoration: underline; }


/* FILTERS */
.filters { padding-top: 130px; padding-left: 48px; padding-right: 48px; padding-bottom: 56px; display: flex; gap: 0; flex-wrap: wrap; align-items: baseline; }
.filter-btn { font-family: 'Inter', sans-serif; font-size: clamp(32px, 5vw, 72px); font-weight: 600; letter-spacing: -0.04em; background: none; border: none; cursor: pointer; color: #ccc; padding: 0; line-height: 1; transition: color 0.15s; }
.filter-btn:hover { color: #999; }
.filter-btn.active { color: #000 !important; }
.filter-sep { font-size: clamp(32px, 5vw, 72px); color: #ddd; font-weight: 600; letter-spacing: -0.04em; margin-right: 10px; line-height: 1; }

/* GRID */
.portfolio-grid { padding: 0 48px 80px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 48px 16px; }
.port-item { aspect-ratio: 1/1; background: #fff; overflow: hidden; cursor: pointer; position: relative; }
.port-item img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 0.3s ease; }
.port-item:hover img { transform: scale(1.03); }
.port-item.hidden { display: none; }

/* VIEW TOGGLE (mobile) */
.view-toggle { display: none; position: fixed; bottom: 24px; right: 24px; z-index: 200; gap: 8px; }
.view-btn { width: 44px; height: 44px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.view-btn.active { background: #000; }
.view-btn.active svg path, .view-btn.active svg rect { fill: #fff; }
.view-btn svg path, .view-btn svg rect { fill: #000; }

/* MOBILE */
@media (max-width: 768px) {
  nav { padding: 16px 20px; }
  .logo { font-size: 18px; }
  .nav-links { display: none; }
  .filters { padding: 24px 20px 16px; gap: 10px; }
  .portfolio-grid { padding: 0 20px 100px; gap: 10px; grid-template-columns: repeat(2, 1fr); }
  .portfolio-grid.single { grid-template-columns: 1fr; gap: 16px; }
  .portfolio-grid.single .port-item { aspect-ratio: 4/3; }
  .view-toggle { display: flex; }
}

.burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; z-index: 1001; background: none; border: none; padding: 4px; }
.burger span { display: block; width: 24px; height: 2px; background: #000; }
.burger-menu { display: none; position: fixed; inset: 0; background: #fff; z-index: 1000; flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 180px 20px 40px; }
.burger-menu.open { display: flex; }
.burger-nav-fixed { position: fixed; top: 0; left: 0; right: 0; padding: 20px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1001; background: #fff; }
.burger-nav-fixed .logo { font-size: 18px; }
.burger-menu a { font-size: 36px; font-weight: 500; letter-spacing: -0.06em; color: #000; text-decoration: none; line-height: 1.1; display: block; }
.burger-order { margin-bottom: 40px; }
.burger-links { display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 768px) { .burger { display: flex; } .filters { padding: 24px 20px 32px; } }

footer { padding: 64px 48px 0; margin-top: 60vh; background: #fff; }
.footer-phone, .footer-email { font-size: 44px; font-weight: 500; letter-spacing: -0.06em; line-height: 1.1; color: #000; }
.footer-contacts { padding: 0 0 48px; }
.footer-wm-logo { display: block; width: 100%; padding: 0.1em 0; }
.footer-btm { display: flex; gap: 32px; padding: 48px 0 32px; }
.footer-btm a { font-size: 12px; font-weight: 500; letter-spacing: -0.06em; color: #000; text-decoration: none; }
.footer-btm a:hover { text-decoration: underline; }
@media (max-width: 768px) {
  footer { padding: 40px 20px 0; margin-top: 60vh; }
  .footer-phone, .footer-email { font-size: 28px; }
  .footer-btm { gap: 16px; flex-wrap: wrap; padding: 32px 0 24px; }
}
</style>
</head>
<body>

<nav>
  <a href="../" class="logo">Midnight Collective</a>
  <div class="nav-links">
    <a href="../#cases">Работы</a>
    <a href="../#form">Заказать проект</a>
  </div>
</nav>

<div class="filters" id="filters">
  <button class="filter-btn active" data-tag="all" onclick="setFilter('all')">Все</button>
</div>

<div class="portfolio-grid" id="grid"></div>

<div class="view-toggle" id="view-toggle">
  <button class="view-btn active" id="btn-grid" onclick="setView('grid')">
    <svg width="18" height="18" viewBox="0 0 18 18"><rect x="0" y="0" width="8" height="8"/><rect x="10" y="0" width="8" height="8"/><rect x="0" y="10" width="8" height="8"/><rect x="10" y="10" width="8" height="8"/></svg>
  </button>
  <button class="view-btn" id="btn-single" onclick="setView('single')">
    <svg width="18" height="18" viewBox="0 0 18 18"><rect x="0" y="0" width="18" height="8"/><rect x="0" y="10" width="18" height="8"/></svg>
  </button>
</div>

<script>
let allProjects = [];
let activeFilter = 'all';

async function load() {
  const r = await fetch('https://raw.githubusercontent.com/egorasus/midnight-collective/main/data/projects.json?t=' + Date.now());
  allProjects = await r.json();
  renderFilters();
  renderGrid();
}

function renderFilters() {
  const tags = ['all', ...new Set(allProjects.flatMap(p => p.tags))];
  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = tags.map((t, i) => {
    const label = t === 'all' ? 'Все' : t;
    const isActive = t === activeFilter;
    const sepColor = isActive ? '#000' : '#ddd';
    const sep = i < tags.length - 1 ? `<span class="filter-sep sep-${i}" style="color:${sepColor}">,</span>` : '';
    return `<button class="filter-btn ${isActive ? 'active' : ''}" data-tag="${t}" onclick="setFilter('${t}')" onmouseenter="hoverSep(${i},true)" onmouseleave="hoverSep(${i},false)">${label}</button>${sep}`;
  }).join('');
}

function setFilter(tag) {
  activeFilter = tag;
  renderFilters();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = activeFilter === 'all' ? allProjects : allProjects.filter(p => p.tags.includes(activeFilter));
  grid.innerHTML = filtered.map(p => `
    <div class="port-item" onclick="location.href='../cases/?slug=${p.slug}'">
      ${p.thumbnail ? `<img src="${p.thumbnail}" alt="${p.title}" loading="lazy">` : ''}
    </div>
  `).join('');
}

function hoverSep(i, on) {
  const sep = document.querySelector('.sep-' + i);
  if (sep && !sep.previousElementSibling?.classList.contains('active')) {
    sep.style.color = on ? '#aaa' : '#ddd';
  }
}
function setView(v) {
  const grid = document.getElementById('grid');
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-single').classList.toggle('active', v === 'single');
  grid.classList.toggle('single', v === 'single');
}

load();

  // Load contacts from settings
  fetch('https://raw.githubusercontent.com/egorasus/midnight-collective/main/data/settings.json?t=' + Date.now())
    .then(r => r.json()).then(s => {
      if (s.phone && document.getElementById('p-phone')) document.getElementById('p-phone').textContent = s.phone;
      if (s.email && document.getElementById('p-email')) document.getElementById('p-email').textContent = s.email;
    }).catch(() => {});

function toggleBurger() {
  const menu = document.getElementById('burger-menu');
  menu.classList.toggle('open');
}
</script>

<footer>
  <div class="footer-contacts">
    <div class="footer-phone" id="p-phone">+7 (912) 000 0000</div>
    <div class="footer-email" id="p-email">midnightcollective@gmail.com</div>
  </div>
  <img src="../logo.svg" alt="Midnight Collective" class="footer-wm-logo">
  <div class="footer-btm">
    <a href="#">Пользовательское соглашение</a>
    <a href="#">Политика конфиденциальности</a>
  </div>
</footer>
</body>
</html>
