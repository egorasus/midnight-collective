server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        rewrite ^(.+)/index\.html$ $1/ permanent;
        rewrite ^(.+)/index$      $1/ permanent;
        rewrite ^(/.+)\.html$     $1  permanent;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
